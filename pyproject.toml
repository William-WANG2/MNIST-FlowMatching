[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mnist-flow-matching"
version = "0.1.0"
description = "Hydra-driven MNIST flow matching training repo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "einops>=0.7",
  "hydra-core>=1.3",
  "matplotlib>=3.8",
  "omegaconf>=2.3",
  "torch>=2.1",
  "torchvision>=0.16",
  "tqdm>=4.66",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
py-modules = ["factories", "run_train", "run_sample", "visualization"]
